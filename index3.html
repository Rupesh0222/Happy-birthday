<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Final Surprise 🎁</title>
  <link rel="stylesheet" href="style3.css" />
</head>
<body>
  <!-- Confetti canvas -->
  <canvas id="confettiCanvas3"></canvas>

  <!-- Background music -->
  <audio id="bgMusic3" src="assets/happy.mp3" preload="auto" loop></audio>

  <!-- Gift panel -->
  <section class="panel final-panel">
    <div class="final-card">
      <div class="gift-wrap">
        <div id="giftBox" class="gift-box">🎁</div>
        <button id="openGiftBtn" class="btn-surprise">Open Me First</button>
      </div>
      <div id="finalMsg" class="heartfelt-msg"></div>
    </div>
    <!-- More surprises button -->
  <div class="more-surprise-btn-wrap">
    <button id="moreBtn3" class="btn-surprise">🎁 More Surprises!</button>
    <p id="redirectMsg3" class="redirect-msg"></p>
  </div>
  </section>

  <!-- Floating balloons -->
  <div class="top-balloons">
    <div class="balloon-g bA"></div>
    <div class="balloon-g bB"></div>
    <div class="balloon-g bC"></div>
    <div class="balloon-g bD"></div>
  </div>

  <script src="script3.js"></script>
</body>
</html>
